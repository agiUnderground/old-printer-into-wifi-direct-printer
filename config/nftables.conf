#!/usr/sbin/nft -f

flush ruleset

table inet printer_filter {

    chain input {
        type filter hook input priority 0;
        policy drop;

        # Allow loopback
        iif lo accept

        # Allow already established connections
        ct state established,related accept


        #
        # DHCP
        #
        udp sport 67 udp dport 68 accept
        udp sport 68 udp dport 67 accept


        #
        # DNS (dnsmasq)
        #
        udp dport 53 accept
        tcp dport 53 accept


        #
        # mDNS / Avahi discovery
        #
        udp dport 5353 accept


        #
        # IPP printing (CUPS)
        #
        tcp dport 631 accept


        #
        # Optional: allow ping for diagnostics
        #
        ip protocol icmp accept
    }


    #
    # No forwarding.
    # This is the important isolation rule.
    #
    chain forward {
        type filter hook forward priority 0;
        policy drop;
    }


    #
    # We don't need output restrictions.
    # The namespace itself has no route out.
    #
    chain output {
        type filter hook output priority 0;
        policy accept;
    }
}
