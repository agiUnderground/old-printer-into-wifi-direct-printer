# Printer Appliance CUPS configuration

# Listen only inside the printer namespace
Port 631

# Disable remote administration
DefaultAuthType Basic

# Logging
LogLevel warn

# Do not expose the CUPS web interface
WebInterface No

ServerRoot /opt/wifi-printer/config
RequestRoot /var/lib/wifi-printer/cups/spool
CacheDir /var/lib/wifi-printer/cups/cache
DataDir /var/lib/wifi-printer/cups/data

# Allow clients from the isolated printer network
<Location />
    Order allow,deny
    Allow 192.168.50.0/24
</Location>


# Printer administration only from localhost
<Location /admin>
    Order allow,deny
    Allow localhost
</Location>


# Default policies

<Policy default>

    JobPrivateAccess default

    JobPrivateValues default

    SubscriptionPrivateAccess default

    SubscriptionPrivateValues default


    <Limit Create-Job Print-Job Print-URI Validate-Job>
        Order deny,allow
    </Limit>


    <Limit Send-Document Send-URI Hold-Job Release-Job Restart-Job Purge-Jobs Set-Job-Attributes Create-Job-Subscription Renew-Subscription Cancel-Subscription Get-Notifications Reprocess-Job Cancel-Current-Job Suspend-Current-Job Resume-Job CUPS-Move-Job CUPS-Get-Document>
        Order deny,allow
    </Limit>


    <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default>
        AuthType Default
        Require user @SYSTEM
        Order deny,allow
    </Limit>


    <Limit Pause-Printer Resume-Printer Enable-Printer Disable-Printer Pause-Printer-After-Current-Job Hold-New-Jobs Release-Held-New-Jobs Deactivate-Printer Activate-Printer Restart-Printer Shutdown-Printer Startup-Printer>
        AuthType Default
        Require user @SYSTEM
        Order deny,allow
    </Limit>

</Policy>
