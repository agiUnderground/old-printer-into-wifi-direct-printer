# Printer Appliance Wi-Fi Access Point

interface=printer0

# 2.4 GHz is recommended for maximum phone compatibility
hw_mode=g

# Channel
channel=6

# Country code (change if needed)
country_code=US

# Enable 802.11n
ieee80211n=1

# SSID shown on phones
ssid=printer

# WPA2 security
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK

# Change this to a generated random password
wpa_passphrase=yoursupersecretpasswordchangeitrightnow

# Hide unnecessary features
wmm_enabled=1

# Do not advertise Internet access
ignore_broadcast_ssid=0

# Logging
logger_syslog=-1
logger_syslog_level=2
logger_stdout=-1
logger_stdout_level=2
