# Printer Appliance DHCP/DNS

# Listen only on printer Wi-Fi interface
interface=printer0

# Do not listen elsewhere
bind-interfaces

# Printer network
dhcp-range=192.168.50.100,192.168.50.200,255.255.255.0,12h

# Linux printer appliance address
dhcp-option=3,192.168.50.1

# DNS server is ourselves
dhcp-option=6,192.168.50.1

# Local hostname
domain=printer.local

# Give the appliance a name
host-record=printer.local,192.168.50.1

# Disable upstream DNS
no-resolv

# Do not forward queries
no-hosts

# Logging
log-dhcp
log-queries

# Required for mDNS coexistence
local=/printer.local/
